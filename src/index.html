<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPU Random Telemetry</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="header">
        <div>
          <p class="eyebrow">NVIDIA SMI Visualizer</p>
          <h1>Random Telemetry</h1>
        </div>
      </header>

      <section class="chart-box" aria-labelledby="chart-title">
        <h2 id="chart-title">Backend random numbers</h2>
        <div class="chart-container">
          <canvas id="telemetry-chart"></canvas>
        </div>
        <p id="error-message" class="error-message" role="alert" hidden></p>
      </section>
    </main>
  </body>
</html>
